    <style type="text/css">
        html, body { height:100%; width:100%; height:100vh; width:100vw; margin:0; padding:0; overflow:hidden; }
        .fill-viewport { position:fixed; top:0; left:0; right:0; bottom:0; padding:0; margin:0; overflow: hidden; }
        .fill-viewport.landscape-left { left: env(safe-area-inset-left); }
		.fill-viewport.landscape-right { right: env(safe-area-inset-right); }
        #viewer { z-index:1; }
        @font-face {
            font-family: "Funnel Display";
            src: url("assets/fonts/FunnelDisplay.ttf") format("truetype");
            font-weight: 300 800;
            font-display: swap;
        }
        #preloadContainer {
            position: fixed;
            inset: 0;
            z-index: 3000;
            display: grid;
            place-items: center;
            background: #fff;
            color: #000;
            font-family: "Funnel Display", system-ui, sans-serif;
        }
        #preloadContainer[hidden] { display: none; }
        .tour-preloader { width: min(280px, calc(100vw - 56px)); text-align: center; }
        .tour-preloader-value {
            display: block;
            margin-bottom: 16px;
            font-size: clamp(44px, 8vw, 76px);
            font-weight: 500;
            font-variant-numeric: tabular-nums;
            letter-spacing: -.055em;
            line-height: 1;
        }
        .tour-preloader-line { height: 2px; background: #dedede; }
        .tour-preloader-fill {
            display: block;
            height: 100%;
            background: #000;
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 140ms linear;
        }
        .tour-preloader-recovery { margin-top: 20px; font-size: 14px; }
        .tour-preloader-recovery button {
            padding: 6px 12px;
            border: 1px solid #000;
            background: #fff;
            color: #000;
            font: inherit;
            cursor: pointer;
        }
        @media (prefers-reduced-motion: reduce) {
            .tour-preloader-fill { transition: none; }
        }
    </style>

    <div id="preloadContainer">
      <div class="tour-preloader">
        <span class="tour-preloader-value" id="tour-preloader-value" aria-hidden="true">0%</span>
        <div class="tour-preloader-line" id="tour-preloader-line" role="progressbar" aria-label="Memuat tur virtual" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">

        </div>
        <div class="tour-preloader-recovery" id="tour-preloader-recovery" hidden>
          <p role="status">Tur masih dimuat.</p>
          <button type="button" id="tour-preloader-retry">Muat ulang</button>
        </div>
      </div>
    </div>
    <div id="viewer" class="fill-viewport"></div>
    <aside class="live-map" id="live-map" aria-label="Denah live Atlas Arcadia" hidden>
      <header class="live-map-header">
        <button class="live-map-toggle" id="live-map-toggle" type="button" aria-controls="live-map-content" aria-expanded="true" title="Ciutkan Denah Live">

          <span class="live-map-north" aria-hidden="true">
            <svg viewBox="0 0 12 14"><path d="M6 1 11 12 6 9 1 12Z"/></svg>
            U

          <svg class="live-map-toggle-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg>
        </button>
      </header>
      <div id="live-map-content">
        <svg class="live-map-plan" viewBox="180 40 1070 920" aria-hidden="true">
          <image href="assets/image/denah-live.svg?v=20261109-r4" x="180" y="40" width="1070" height="920"/>
          <g id="live-map-marker">
            <circle class="live-map-halo" r="36"/>
            <g id="live-map-heading">
              <!-- Keep the rotation bounds centered on the marker. -->
              <circle r="68" fill="none" stroke="none"/>
              <path d="M0 -58 18 -27 0 -34 -18 -27Z"/>
            </g>
            <circle class="live-map-dot" r="20"/>
          </g>
        </svg>
        <p class="live-map-label" id="live-map-label"></p>
      </div>
    </aside>
